# Exemplo de homologação gratuita. Ver limites e preparação no README.
services:
  - type: web
    name: remedio-certo-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '15'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '7'
      - key: DATABASE_URL
        fromDatabase:
          name: remedio-certo-db
          property: connectionString
      - key: ALERTS_ENABLED
        value: 'true'
      - key: ALERTS_INTERVAL_SECONDS
        value: '60'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

databases:
  - name: remedio-certo-db
    databaseName: remedio_certo
    user: remedio_certo
    plan: free
    region: oregon
    ipAllowList: []
